<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; }
        .container { width: 400px; margin: 100px auto; background: white; padding: 30px; }
        input { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ffc107; color: black; border: none; margin-top: 15px; }
        a { display: inline-block; margin-top: 15px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reset Password</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="new_password" placeholder="New Password" required>
            <button type="submit">Reset Password</button>
        </form>
        <a href="{{ url_for('login') }}">Back to login</a>
    </div>
</body>
</html>
