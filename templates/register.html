<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; }
        .container { width: 420px; margin: 80px auto; background: white; padding: 30px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; margin-top: 15px; }
        .checkbox { width: auto; margin-top: 15px; }
        a { display: inline-block; margin-top: 15px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        <form method="POST" action="{{ url_for('register') }}">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="text" name="location_id" placeholder="Location ID" required>
            <input type="date" name="account_expirydate" placeholder="Account Expiry Date">
            <label>
                <input class="checkbox" type="checkbox" name="active_flag" checked> Active
            </label><br>
            <label>
                <input class="checkbox" type="checkbox" name="enable_2fa"> Enable Google/Microsoft Authenticator
            </label>
            <button type="submit">Register</button>
        </form>
        <a href="{{ url_for('login') }}">Back to login</a>
    </div>
</body>
</html>
